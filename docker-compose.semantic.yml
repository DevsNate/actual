name: actual-semantic

services:
  semantic-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: actual_semantic
      POSTGRES_USER: actual
      POSTGRES_PASSWORD: ${SEMANTIC_POSTGRES_PASSWORD:-actual-local-dev}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U actual -d actual_semantic]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - semantic-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  semantic-server:
    build:
      context: .
      dockerfile: sync-server.Dockerfile
      target: prod
    image: actual-semantic-server:local
    depends_on:
      semantic-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ACTUAL_HOSTNAME: 0.0.0.0
      ACTUAL_PORT: 5006
      ACTUAL_DATA_DIR: /data
      ACTUAL_SEMANTIC_ENABLED: 'true'
      ACTUAL_SEMANTIC_DATABASE_URL: postgresql://actual:${SEMANTIC_POSTGRES_PASSWORD:-actual-local-dev}@semantic-db:5432/actual_semantic
      ACTUAL_STOCK_WEB_ENABLED: ${ACTUAL_STOCK_WEB_ENABLED:-true}
      ACTUAL_STOCK_WEB_ROOT: /stock-web-runtime
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5006/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      - ${SEMANTIC_SERVER_PORT:-5006}:5006
    volumes:
      - semantic-actual-data:/data
      - ${ACTUAL_STOCK_WEB_RUNTIME_ROOT:-./web-stock-runtime/vendor/current}:/stock-web-runtime:ro
    restart: unless-stopped

  semantic-test:
    profiles: [test]
    build:
      context: .
      dockerfile: sync-server.Dockerfile
      target: test
    depends_on:
      semantic-test-db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      SEMANTIC_POSTGRES_TEST_URL: postgresql://actual:${SEMANTIC_POSTGRES_PASSWORD:-actual-local-dev}@semantic-test-db:5432/actual_semantic_test
    command:
      - /bin/sh
      - -c
      - >-
        yarn workspace @actual-app/semantic-postgres test &&
        yarn workspace @actual-app/sync-server test
        src/semantic/postgres-runtime.integration.test.ts

  semantic-test-db:
    profiles: [test]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: actual_semantic_test
      POSTGRES_USER: actual
      POSTGRES_PASSWORD: ${SEMANTIC_POSTGRES_PASSWORD:-actual-local-dev}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U actual -d actual_semantic_test]
      interval: 1s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  semantic-actual-data:
  semantic-postgres-data:
